<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BABIDJON TEAM</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav>
        <a href="#" onclick="showPage('home')">Главная</a>
        <a href="#" onclick="showPage('resources')">Наши ресурсы</a>
        <a href="#" onclick="showPage('maps')">Наши карты</a>
        <a href="#" onclick="showPage('creators')">Создатели</a>
    </nav>

    <!-- ГЛАВНАЯ -->
    <div class="page active" id="home">
        <h1 class="glitch" data-text="BABIDJON TEAM">BABIDJON TEAM</h1>
    </div>

    <!-- НАШИ РЕСУРСЫ -->
    <div class="page" id="resources">
        <h2 class="page-title">НАШИ РЕСУРСЫ</h2>
        <div class="resources-grid">
            <a class="resource-btn" href="https://www.youtube.com/channel/UC4itD5S73BvjV8xUNRMKLSQ" target="_blank">YouTube</a>
            <a class="resource-btn" href="https://www.tiktok.com/@bbjntm" target="_blank">TikTok</a>
            <a class="resource-btn" href="https://discord.gg/babijonggserverbbjn" target="_blank">Discord</a>
            <a class="resource-btn" href="https://t.me/bbjnte" target="_blank">Telegram</a>
        </div>
    </div>

    <!-- НАШИ КАРТЫ -->
    <div class="page" id="maps">
        <h2 class="page-title">НАШИ КАРТЫ</h2>
        <div class="maps-list">
            <div class="map-item" onclick="openMapModal('Побег Димы Масленникова')">
                Побег Димы Масленникова
            </div>
        </div>
    </div>

    <!-- СОЗДАТЕЛИ -->
    <div class="page" id="creators">
        <h2 class="page-title">СОЗДАТЕЛИ</h2>
        <div class="creators-list">
            <div class="creator-item" onclick="openCreatorModal('Okone')">Okone</div>
            <div class="creator-item" onclick="openCreatorModal('YaychaMegatrona')">YaychaMegatrona</div>
            <div class="creator-item" onclick="openCreatorModal('o666rn')">o666rn</div>
            <div class="creator-item" onclick="openCreatorModal('Ustreal')">Ustreal</div>
        </div>
    </div>

    <!-- МОДАЛКА КАРТЫ -->
    <div class="modal-overlay" id="mapModal">
        <div class="modal">
            <h3 id="mapTitle"></h3>
            <div class="modal-buttons">
                <button class="btn-download" onclick="downloadMap()">СКАЧАТЬ</button>
                <button class="btn-back" onclick="closeModal('mapModal')">НАЗАД</button>
            </div>
        </div>
    </div>

    <!-- МОДАЛКА СОЗДАТЕЛЯ -->
    <div class="modal-overlay" id="creatorModal">
        <div class="modal">
            <div class="shapes-bg" id="shapesBg"></div>
            <h3 id="creatorName"></h3>
            <p id="creatorRole"></p>
            <div class="modal-buttons">
                <button class="btn-back" onclick="closeModal('creatorModal')">НАЗАД</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
